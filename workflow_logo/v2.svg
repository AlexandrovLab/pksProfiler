<svg xmlns="http://www.w3.org/2000/svg" width="930" height="819" viewBox="0 0 930 819" role="img" aria-label="pksProfiler workflow: a shared trunk of read extraction, quality filtering and human-read removal produces MAPPED_READS, the complete host-depleted stream, which branches into a metagenome lane that assembles and bins the community and a tumour lane that scores read evidence and then returns to the complete stream to reassemble the island; assembled output from either lane is strain typed">
