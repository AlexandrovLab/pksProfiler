<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1372" viewBox="0 0 1040 1372" role="img" aria-label="pksProfiler v0.0.2 workflow: a shared trunk of read extraction, fastp filtering and host depletion produces the complete host-depleted read stream, which branches by sample type through an optional krakenuniq plus DIAMOND blastx prefilter into a metagenome MAG lane of assembly, binning, quality, taxonomy, annotation, prophage detection and clb HMM search, and a tumour lane of alignment profiling, evidence tiering, targeted dual-assembler assembly and contig validation. Assembled units from both lanes are MLST-typed and joined to clonal complex and phylogroup from a 45,761-genome reference panel.">
        <rect x="0" y="0" width="1040" height="1372" fill="#ffffff"/><defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d70"></path>
          </marker>
          <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c8c86"></path>
          </marker>
          <marker id="ah-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c26055"></path>
          </marker>
          <marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8892b"></path>
          </marker>
        </defs>

        <!-- ============ SHARED TRUNK ============ -->
        <rect x="320" y="14" width="400" height="50" rx="3" fill="#f4f7f6" stroke="#ccd6d4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="520" y="35" text-anchor="middle">Sequencing input</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="51" text-anchor="middle">BAM · CRAM · FASTQ — per-row autodetect</text>

        <line x1="520" y1="64" x2="520" y2="84" stroke="#5d6d70" stroke-width="1.3" marker-end="url(#ah)"></line>

        <rect x="320" y="86" width="400" height="50" rx="3" fill="#ffffff" stroke="#ccd6d4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="520" y="107" text-anchor="middle">extractReads</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="123" text-anchor="middle">unmapped reads · CRAM SN/LN/M5 validated</text>

        <line x1="520" y1="136" x2="520" y2="156" stroke="#5d6d70" stroke-width="1.3" marker-end="url(#ah)"></line>

        <rect x="320" y="158" width="400" height="50" rx="3" fill="#ffffff" stroke="#ccd6d4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="520" y="179" text-anchor="middle">filterReads</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="195" text-anchor="middle">fastp — adapters, quality</text>

        <line x1="520" y1="208" x2="520" y2="228" stroke="#5d6d70" stroke-width="1.3" marker-end="url(#ah)"></line>

        <rect x="320" y="230" width="400" height="50" rx="3" fill="#ffffff" stroke="#ccd6d4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="520" y="251" text-anchor="middle">mapReads</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="267" text-anchor="middle">GRCh38 → T2T+PhiX → optional pangenome</text>

        <line x1="520" y1="280" x2="520" y2="300" stroke="#5d6d70" stroke-width="1.3" marker-end="url(#ah)"></line>

        <rect x="300" y="302" width="440" height="54" rx="3" fill="#f4f7f6" stroke="#111a1c" stroke-width="1.6"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#111a1c" x="520" y="324" text-anchor="middle">MAPPED_READS</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="341" text-anchor="middle">complete host-depleted stream — branch point</text>

        <!-- branch elbow -->
        <path d="M 520 356 V 384" fill="none" stroke="#5d6d70" stroke-width="1.3"></path>
        <path d="M 260 384 H 780" fill="none" stroke="#5d6d70" stroke-width="1.3"></path>
        <path d="M 260 384 V 424" fill="none" stroke="#2c8c86" stroke-width="1.6" marker-end="url(#ah-m)"></path>
        <path d="M 780 384 V 424" fill="none" stroke="#c26055" stroke-width="1.6" marker-end="url(#ah-t)"></path>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#2c8c86" x="252" y="401" text-anchor="end">sample_type = metagenome</text>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#c26055" x="788" y="401">sample_type = tumor_wgs</text>

        <!-- lane headers -->
        <text font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="0.6" x="60" y="418" fill="#0f6b66">METAGENOME LANE</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="0.6" x="980" y="418" text-anchor="end" fill="#a4433a">TUMOUR LANE</text>

        <!-- ============ METAGENOME LANE ============ -->
        <rect x="60" y="426" width="400" height="52" rx="3" fill="#d5e8e5" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="448" text-anchor="middle">megahitAssemble</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="464" text-anchor="middle">de novo contigs from the complete stream</text>
        <line x1="260" y1="478" x2="260" y2="500" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="502" width="400" height="52" rx="3" fill="none" stroke="#2c8c86" stroke-dasharray="4 3"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="524" text-anchor="middle">contig-count gate</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="540" text-anchor="middle">0 contigs = a real negative, not an error</text>
        <line x1="260" y1="554" x2="260" y2="576" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="578" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="600" text-anchor="middle">alignToContigs → jgiContigDepths</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="616" text-anchor="middle">per-contig coverage for binning</text>
        <line x1="260" y1="630" x2="260" y2="652" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="654" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="676" text-anchor="middle">metabat2Bin</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="692" text-anchor="middle">contigs → MAG bins, fanned out per bin</text>
        <line x1="260" y1="706" x2="260" y2="728" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="730" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="752" text-anchor="middle">checkm2Predict · gtdbtkClassify</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="768" text-anchor="middle">completeness and taxonomy, all bins together</text>
        <line x1="260" y1="782" x2="260" y2="804" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="806" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="828" text-anchor="middle">prokkaAnnotate</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="844" text-anchor="middle">every bin — runs first so locus_tags match</text>
        <line x1="260" y1="858" x2="260" y2="880" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="882" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="904" text-anchor="middle">hmmsearchClb · genomadProphages</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="920" text-anchor="middle">clb exact_v1 protein HMM · provirus calls per MAG</text>
        <line x1="260" y1="934" x2="260" y2="956" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="958" width="400" height="52" rx="3" fill="#d5e8e5" stroke="#2c8c86" stroke-width="1.5"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="980" text-anchor="middle">pks+ bin filter</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="996" text-anchor="middle">hit_count &gt; 0</text>
        <line x1="260" y1="1010" x2="260" y2="1032" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="1034" width="400" height="52" rx="3" fill="#ffffff" stroke="#2c8c86"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="1056" text-anchor="middle">extractGenomicContext</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="1072" text-anchor="middle">±50 kb flank · integrase · tRNA · provirus overlap</text>
        <line x1="260" y1="1086" x2="260" y2="1108" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></line>

        <rect x="60" y="1110" width="400" height="52" rx="3" fill="#f4f7f6" stroke="#0f6b66" stroke-width="1.6"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="260" y="1132" text-anchor="middle">magSummaryTable</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="260" y="1148" text-anchor="middle">per-sample MAG + prophage + context summary</text>

        <!-- ============ TUMOUR LANE ============ -->
        <rect x="580" y="426" width="400" height="64" rx="3" fill="none" stroke="#5d6d70" stroke-dasharray="4 3"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="447" text-anchor="middle">prefilter — auto: on for metagenomes</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="463" text-anchor="middle">krakenuniq → taxid 91347 · DIAMOND blastx rescue</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="479" text-anchor="middle">narrows PROFILING_READS only — never assembly</text>
        <line x1="780" y1="490" x2="780" y2="512" stroke="#5d6d70" stroke-width="1.3" marker-end="url(#ah)"></line>

        <rect x="580" y="514" width="400" height="52" rx="3" fill="#f4dfda" stroke="#c26055"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="536" text-anchor="middle">pksProfilerAlign</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="552" text-anchor="middle">Bowtie2 → featureCounts --largestOverlap</text>
        <line x1="780" y1="566" x2="780" y2="588" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="590" width="400" height="52" rx="3" fill="#ffffff" stroke="#c26055"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="612" text-anchor="middle">classifyTumorPksEvidence</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="628" text-anchor="middle">reads · clb genes · island breadth @ ≥1×</text>
        <line x1="780" y1="642" x2="780" y2="664" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="666" width="400" height="64" rx="3" fill="#f6e8c9" stroke="#b8892b" stroke-width="1.8"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="687" text-anchor="middle">TIER GATE</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="703" text-anchor="middle">broad_island ≥30/8/10% · extensive_island ≥100/10/20%</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="719" text-anchor="middle">multi_gene and below are classified, not assembled</text>
        <line x1="780" y1="730" x2="780" y2="752" stroke="#b8892b" stroke-width="1.6" marker-end="url(#ah-g)"></line>

        <rect x="580" y="754" width="400" height="52" rx="3" fill="#f4f7f6" stroke="#111a1c" stroke-width="1.4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="776" text-anchor="middle">re-join MAPPED_READS</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="792" text-anchor="middle">eligible sample IDs → complete stream</text>
        <line x1="780" y1="806" x2="780" y2="828" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <!-- long edge: complete stream feeds the re-join -->
        <path d="M 740 329 H 1014 V 780 H 984" fill="none" stroke="#111a1c" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ah)"></path>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#111a1c" x="1008" y="598" text-anchor="middle" transform="rotate(-90 1008 554)">complete stream, not the profiled subset</text>

        <rect x="580" y="830" width="400" height="52" rx="3" fill="#ffffff" stroke="#c26055"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="852" text-anchor="middle">targetedPksRecruit</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="868" text-anchor="middle">≥60 aligned bp, ≥90% identity — mates recovered</text>
        <line x1="780" y1="882" x2="780" y2="904" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="906" width="400" height="52" rx="3" fill="#f4dfda" stroke="#c26055" stroke-width="1.5"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="928" text-anchor="middle">targetedPksMegahit ∥ targetedPksSpades</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="944" text-anchor="middle">both assemblers, every eligible sample</text>
        <line x1="780" y1="958" x2="780" y2="980" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="982" width="400" height="52" rx="3" fill="#ffffff" stroke="#c26055"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="1004" text-anchor="middle">alignTargetedContigs → canonical ref</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="1020" text-anchor="middle">contigs vs IHE3034 island → PAF</text>
        <line x1="780" y1="1034" x2="780" y2="1056" stroke="#c26055" stroke-width="1.3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="1058" width="400" height="52" rx="3" fill="#f4f7f6" stroke="#a4433a" stroke-width="1.6"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="1080" text-anchor="middle">summarizeTargetedPksEvidence</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="1096" text-anchor="middle">assembler agreement → final structural evidence</text>
        <line x1="780" y1="1110" x2="780" y2="1132" stroke="#c26055" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-t)"></line>

        <rect x="580" y="1134" width="400" height="64" rx="3" fill="none" stroke="#c26055" stroke-dasharray="4 3"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="780" y="1156" text-anchor="middle">tumorWGS — optional context</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="1172" text-anchor="middle">prokka → clb HMM → geNomad → contig context</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="1188" text-anchor="middle">--tumor_full_contig_context, needs genomad_db</text>

        <rect x="580" y="1210" width="400" height="40" rx="3" fill="none" stroke="#ccd6d4" stroke-dasharray="4 3"></rect>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="780" y="1235" text-anchor="middle">pksMAG on tumour reads — --tumor_enable_mags, off by default</text>

                <!-- shared: strain typing on assembled units, both lanes -->
        <path d="M 260 1162 V 1188" fill="none" stroke="#2c8c86" stroke-width="1.3" marker-end="url(#ah-m)"></path>
        <path d="M 780 1250 V 1268" fill="none" stroke="#c26055" stroke-width="1.3" stroke-dasharray="4 3"></path>
        <path d="M 260 1188 H 780 V 1268" fill="none" stroke="#5d6d70" stroke-width="1.3"></path>
        <rect x="60" y="1270" width="920" height="52" rx="3" fill="#f4f7f6" stroke="#111a1c" stroke-width="1.4"></rect>
        <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#111a1c" x="520" y="1292" text-anchor="middle">strainTyping — MLST → ST → clonal complex · phylogroup</text>
        <text font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#5d6d70" x="520" y="1308" text-anchor="middle">assembled units only · &lt;500 kb or &lt;7 loci → no call · non-B2 flagged (92% of panel pks+ is B2)</text>

<text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5d6d70" x="60" y="1352">Solid outline = runs by default   ·   Dashed = optional or a filter   ·   Bold outline = decision or handoff point</text>
      </svg>
