<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pksProfiler workflow explorer</title><style>body{margin:0}main{max-width:1440px;margin:auto}</style></head><body><main><div id="pks-workflow-hover">
  <style>
    #pks-workflow-hover { color-scheme:light dark; --wh-bg:light-dark(#fff,#0d1117); --wh-text:light-dark(#263746,#e6edf3); --wh-muted:light-dark(#596874,#a8b4bf); --wh-line:light-dark(#d4dce3,#35404b); --wh-soft:light-dark(#f2f5f8,#17212c); --wh-link:light-dark(#345e91,#92b9ef); color:var(--wh-text); background:var(--wh-bg); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; padding:16px; }
    #pks-workflow-hover * { box-sizing:border-box; }
    #pks-workflow-hover h2 { margin:0 94px 5px 0; font-size:21px; font-weight:500; }
    #pks-workflow-hover .wh-help { color:var(--wh-muted); margin:0 0 12px; }
    #pks-workflow-hover .wh-surface { position:relative; }
    #pks-workflow-hover .wh-map { position:relative; background:white; }
    #pks-workflow-hover .wh-map > svg { display:block; width:100%; height:auto; }
    #pks-workflow-hover .wh-hit { position:absolute; padding:0; margin:0; background:transparent; border:0; border-radius:5px; }
    #pks-workflow-hover .wh-hit:hover, #pks-workflow-hover .wh-hit:focus-visible, #pks-workflow-hover .wh-hit[data-active="true"] { background:color-mix(in srgb,var(--wh-link) 9%,transparent); outline:2px solid var(--wh-link); outline-offset:1px; }
    #pks-workflow-hover .wh-popover { position:absolute; z-index:10; width:410px; max-width:100%; background:var(--wh-bg); color:var(--wh-text); border:1px solid var(--wh-line); border-radius:10px; padding:16px; box-shadow:0 10px 35px #0003; }
    #pks-workflow-hover [hidden] { display:none!important; }
    #pks-workflow-hover .wh-pophead { display:flex; align-items:flex-start; gap:12px; }
    #pks-workflow-hover h3 { margin:0; font-size:17px; line-height:1.35; font-weight:500; flex:1; }
    #pks-workflow-hover .wh-close { font:inherit; color:var(--wh-muted); border:0; background:transparent; padding:0 4px; min-width:24px; min-height:24px; }
    #pks-workflow-hover .wh-scope { color:var(--wh-muted); font-size:12px; margin:7px 0 10px; }
    #pks-workflow-hover .wh-lens { background:white; border-radius:4px; overflow:hidden; margin-bottom:12px; }
    #pks-workflow-hover .wh-lens > svg { display:block; width:100%; height:138px; }
    #pks-workflow-hover ol { margin:0 0 12px; padding-left:19px; font-size:13px; }
    #pks-workflow-hover li { margin:0 0 7px; }
    #pks-workflow-hover .wh-label { margin:10px 0 4px; font-size:12px; font-weight:500; }
    #pks-workflow-hover .wh-values { display:flex; flex-wrap:wrap; gap:4px 6px; }
    #pks-workflow-hover code { font:11.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; overflow-wrap:anywhere; background:var(--wh-soft); padding:2px 4px; border-radius:3px; max-width:100%; }
    #pks-workflow-hover .wh-note { color:var(--wh-muted); font-size:12px; margin:10px 0 0; }
    #pks-workflow-hover .wh-sources { display:flex; flex-wrap:wrap; gap:5px 12px; border-top:1px solid var(--wh-line); padding-top:9px; margin-top:11px; font-size:12px; }
    #pks-workflow-hover a { color:var(--wh-link); overflow-wrap:anywhere; }
    #pks-workflow-hover .wh-foot { color:var(--wh-muted); font-size:12px; margin:12px 0 0; }
    #pks-workflow-hover .wh-sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
    @media(max-width:480px) { #pks-workflow-hover { padding:10px; } #pks-workflow-hover h2 { font-size:18px; } #pks-workflow-hover .wh-popover { padding:13px; } }
    @media(pointer:coarse) { #pks-workflow-hover .wh-close { min-width:44px; min-height:44px; } #pks-workflow-hover .wh-hit { min-height:32px; } }

  <script type="application/json" data-wh="data">[{"id": "input", "group": "A. Preparation", "title": "Sequence input and read extraction", "hit": [40, 98, 115, 122], "view": [30, 83, 350, 180], "scope": "BAM / CRAM or gzipped FASTQ; one biological mode per run", "steps": ["The sample sheet chooses either alignment input or FASTQ input. BAM and CRAM can share an alignment sheet; alignment and FASTQ columns cannot be mixed.", "For alignments, extract primary unmapped records. In auto mode, detected BWA-MEM input also contributes primary mapped records with alignment score AS < 30.", "CRAM requires the matching source FASTA. Unaligned BAM input must be converted to FASTQ."], "parameters": ["--input_data_type auto|bam|cram|fastq", "--cram_reference <matching FASTA>", "--extract_low_score_mapped auto|on|off", "--extract_min_as 30"], "outputs": ["Extracted FASTQ stream", "Input-header provenance and extraction QC"], "caution": "A BAM/CRAM input must include reference sequences in its @SQ header.", "sources": ["Modules/extract_reads.nf", "docs/running/bam.md"]}, {"id": "qc", "group": "A. Preparation", "title": "Read quality filtering", "hit": [247, 102, 120, 151], "view": [235, 90, 230, 180], "scope": "Short reads and supported ONT/HiFi runs", "steps": ["Short reads are adapter/quality filtered with fastp; the default command includes a 45-base length floor and tail quality trimming.", "Long reads use fastplong with a default minimum length of 200 bases.", "Retained read counts feed the attrition table. Filtering does not establish microbial identity."], "parameters": ["--read_type short|ont|hifi", "--long_read_min_length 200"], "outputs": ["Quality-filtered reads", "filter_input_reads and reads_after_fastp QC fields"], "caution": "The QC column name reads_after_fastp is retained for long reads even though fastplong performs the filtering.", "sources": ["Modules/filter_reads.nf", "docs/running/long_reads.md"]}, {"id": "host", "group": "A. Preparation", "title": "Human and phiX depletion", "hit": [480, 105, 625, 174], "view": [475, 98, 635, 185], "scope": "All supported modes; RNA uses splice-aware GRCh38 depletion", "steps": ["Remove reads aligning to the supplied GRCh38 reference, then remove reads aligning to the T2T/phiX reference.", "RNA replaces the first DNA index with a splice-aware human reference; optional junction annotations support junction-spanning alignments.", "Supplying a pangenome reference enables an additional human-depletion pass.", "ONT/HiFi use technology-appropriate presets and long-read indexes or FASTA; a short-read binary index cannot simply be relabeled."], "parameters": ["--hg38_db / --rna_splice_db", "--t2t_phix_db", "--pangenome_db (optional)", "--rna_junctions_bed (optional)", "--minimap2_frag_mode no"], "outputs": ["Reads surviving each depletion pass", "Host-depletion attrition metrics"], "caution": "Retained means not removed by these passes; it is not proof that every read is bacterial.", "sources": ["lib/HostDepletion.groovy", "docs/running/wes_rna.md", "docs/running/long_reads.md"]}, {"id": "stream", "group": "A. Preparation", "title": "The complete host-depleted stream", "hit": [1250, 98, 300, 130], "view": [1225, 80, 340, 180], "scope": "Shared input for profiling and eligible reconstruction branches", "steps": ["This stream contains every read surviving quality control and host depletion.", "Optional profiling prefiltering does not narrow the input used for WGS recruitment or metagenome assembly.", "Metagenome pks reads per million use this full final host-depleted read count as the denominator."], "parameters": ["host_depleted_reads = final depletion count", "pks_reads_per_million = pks_reads × 1,000,000 / host_depleted_reads"], "outputs": ["Complete retained read stream", "Denominator for metagenome RPM"], "caution": "A zero denominator yields NA, not a zero abundance estimate.", "sources": ["main.nf", "scripts/classify_tumor_pks_evidence.py"]}, {"id": "alignment", "group": "B. Profiling", "title": "Reference alignment and gene assignment", "hit": [40, 350, 730, 320], "view": [40, 350, 730, 320], "scope": "All supported sample/read combinations; selector: bowtie2 or both", "steps": ["Short reads align to the full IHE3034 E. coli reference genome with Bowtie2. Long reads use minimap2 against the corresponding reference FASTA.", "Retain alignments at MAPQ ≥ 40, then assign reads to the 19 annotated clb genes.", "A read overlapping multiple genes is assigned to the gene with greatest overlap; ambiguous ties are not forced.", "Generate per-gene counts and canonical-island depth/breadth. Optional read taxonomy, decoy specificity checks, and positive-panel comparisons have separate mode restrictions."], "parameters": ["--profiling_method bowtie2|both", "--pks_align_min_mapq 40 (fixed)", "Canonical island: 50,768 bp"], "outputs": ["Per-sample counts and alignment QC", "cohort/gene_counts/pks.gene.counts.align.txt", "Alignment-derived evidence file for the chosen mode"], "caution": "Read counts are not fragment counts. A confident alignment to one reference is not proof of uniqueness across all microbes.", "sources": ["Modules/pksProfiler_align.nf", "scripts/classify_tumor_pks_evidence.py", "docs/running/specificity.md"]}, {"id": "hmm", "group": "B. Profiling", "title": "Nucleotide HMM profiling", "hit": [830, 350, 730, 320], "view": [830, 350, 730, 320], "scope": "HMM-only: short-read metagenomes; both: all supported combinations", "steps": ["Compare read nucleotide sequences with the clb DNA profile models using nhmmscan.", "The default E-value threshold is 1e-10. Optional chunking allows parallel scanning.", "When both methods run, alignment and HMM counts stay separate.", "HMM-only runs do not create alignment coverage or read_evidence.tsv, but metagenome genome reconstruction can still run independently."], "parameters": ["--profiling_method hmm|both", "--hmm_evalue 1e-10", "--hmm_chunking true (optional)"], "outputs": ["Per-sample HMM hit/count files", "cohort/gene_counts/pks.gene.counts.hmm.txt"], "caution": "This is a nucleotide search. The protein HMM search used in MAG annotation is a different analysis.", "sources": ["Modules/pksProfiler_hmm.nf", "ref/hmm/PROVENANCE.md", "docs/running/hmm.md"]}, {"id": "prefilter", "group": "B. Profiling", "title": "Optional balanced profiling prefilter", "hit": [40, 678, 350, 35], "view": [40, 350, 730, 365], "scope": "Auto enables balanced mode for metagenomes supplied with a Kraken database", "steps": ["KrakenUniq retains reads assigned to the selected bacterial group; the default primary taxid is Enterobacterales (91347).", "DIAMOND searches the rejected set for clb-like sequence and rescues matching reads. Balanced mode requires this rescue.", "Merge retained and rescued candidates for profiling. Assembly still starts from the full host-depleted stream.", "Whole-community taxonomy uses the complete non-host classification report, not just the profiled candidates."], "parameters": ["--prefilter_mode auto|off|balanced", "--kraken_db <directory>", "--diamond_rescue true"], "outputs": ["Profiling candidate stream", "prefilter/diamond_rescue_taxonomy.tsv"], "caution": "Rescue taxonomy is read-level taxonomic support, not carrier attribution. Adding --kraken_db can change auto prefilter behavior.", "sources": ["docs/prefilter.md", "main.nf"]}, {"id": "wgs", "group": "C. Reconstruction", "title": "Short-read WGS evidence gate", "hit": [40, 840, 730, 67], "view": [40, 840, 730, 245], "scope": "Tiered short-read WGS only; long-read WGS is untiered", "steps": ["Read tiers combine assigned reads, detected genes, and ≥1× island breadth; all three thresholds for a tier must be met.", "multi_gene: ≥5 reads, ≥3 genes, ≥1% breadth. broad_island: ≥30 reads, ≥8 genes, ≥7.5% breadth. extensive_island: ≥100 reads, ≥10 genes, ≥15% breadth.", "Targeted reassembly is enabled by default for broad_island and extensive_island; the gate selects sample IDs, then recruitment uses their full host-depleted reads.", "No WGS read tier is assigned to metagenomes, WES, RNA, or long-read WGS."], "parameters": ["--sample_type wgs", "--tumor_targeted_assembly true|false", "--tumor_contig_tiers broad_island,extensive_island"], "outputs": ["by_sample/<sample>/read_evidence.tsv", "Eligibility for targeted recruitment and assembly"], "caution": "These are operational evidence categories, not clinical diagnoses or calibrated probabilities. localized_indeterminate is distinct from zero reads.", "sources": ["scripts/classify_tumor_pks_evidence.py", "Modules/pks_targeted.nf"]}, {"id": "recruit", "group": "C. Reconstruction", "title": "Island recruitment and mate recovery", "hit": [50, 911, 196, 111], "view": [40, 840, 730, 245], "scope": "Eligible short-read WGS samples", "steps": ["Recruit from the complete host-depleted stream against the canonical island plus 5 kb of flanking sequence on each side.", "Separate island-internal, boundary-spanning, and flank-only support. Recover mates and preserve singletons for assembly.", "Default recruitment requires MAPQ ≥20, ≥60 aligned bases, and ≥90% identity; internal/flank-only reads also require ≥80% query coverage.", "Only island-internal and boundary-spanning fragments count as island-supporting fragments for the assembly-input diagnostic."], "parameters": ["--recruit_min_mapq 20", "--pks_recruit_min_aligned 60", "--pks_recruit_min_identity 0.90", "--recruit_min_query_coverage 0.80"], "outputs": ["contigs/recruitment/pks_recruitment.tsv", "Recovered pairs and singletons for assembly"], "caution": "Shared flanks can recruit reads from pks-negative relatives. Flank-only support is not island support.", "sources": ["docs/running/assembly.md", "Modules/pks_targeted.nf"]}, {"id": "assembly", "group": "C. Reconstruction", "title": "Two-assembler island reconstruction", "hit": [255, 910, 505, 110], "view": [40, 840, 730, 245], "scope": "Targeted short-read WGS; not WES/RNA or ONT/HiFi", "steps": ["Assemble the recruited read set with MEGA . Reconstruction", "title": "Locus evidence in bins and unbinned contigs", "hit": [1285, 910, 270, 110], "view": [845, 900, 710, 155], "scope": "Metagenome genome-level assessment; separate from sample read evidence", "steps": ["Align each recovered genome bin to the canonical pks locus, even when protein HMM screening finds little support.", "Assess locus evidence in pooled unbinned contigs too, recording them separately from reconstructed genomes.", "Count a bin as pks-positive using its own alignment-based locus tier, rather than raw protein-domain homology alone.", "Carry genome quality and taxonomy alongside locus support when interpreting a candidate genome."], "parameters": ["Alignment-derived per-unit locus evidence", "Protein HMM screen: separate annotation evidence"], "outputs": ["genomes/pks_mag_summary.tsv (unit_type: bin or unbinned)", "Separate mag_bins_* and mag_unbinned_* master-summary fields"], "caution": "A positive unbinned row is not another positive genome and does not identify an organism carrying the island.", "sources": ["Modules/pks_mag.nf", "scripts/build_master_summary.py"]}, {"id": "context", "group": "C. Reconstruction", "title": "Genomic context, prophages, and E. coli typing", "hit": [840, 1032, 715, 47], "view": [830, 840, 730, 245], "scope": "Recovered metagenome genome bins", "steps": ["Summarize prophage predictions and genes around clb hits; the default flanking context window is ±50 kb.", "Record nearby integrase/tRNA features and community-bin co-occurrence to prioritize hypotheses about mobility and interactions.", "Apply seven-locus E. coli Achtman MLST to sufficiently large recovered bins, then join sequence types to the reference clonal-complex/phylogroup lookup.", "Insufficient or novel allele combinations remain explicitly unresolved rather than receiving a guessed known type."], "parameters": ["--context_window_bp 50000", "--enable_strain_typing true (default)", "Default scheme: ecoli_achtman_4", "Default assembly-size floor: 500,000 bp"], "outputs": ["community/pks_island_mobility.tsv", "community/pks_community_interactions.tsv", "community/community_prophage_inventory.tsv", "strain/strain_types.tsv"], "caution": "Co-occurrence does not establish physical proximity, interaction, transfer, or prophage induction. This typing branch is not wired to WGS contigs.", "sources": ["Modules/pks_mag.nf", "Modules/pks_typing.nf", "docs/running/community_context.md"]}, {"id": "report", "group": "D. Results", "title": "Cohort HTML report, tables, and QC", "hit": [65, 1190, 1470, 150], "view": [65, 1190, 1470, 150], "scope": "Run-specific cohort summary; panels depend on available outputs", "steps": ["The cohort report brings together gene support, mode-specific evidence, eligible assemblies, and optional analyses produced by the run.", "The master summary joins enabled stages into one row per sample; QC records attrition and terminal status.", "Inspect missing stages before interpreting a blank cell or NA as a biological zero.", "The synthetic example linked in the README illustrates the cohort layout; it does not contain every plot produced by a real run."], "parameters": ["cohort/pks_cohort_report.html", "cohort/pks.master_summary.tsv", "cohort/qc/pks.qc.summary.tsv"], "outputs": ["HTML cohort report and report TSV", "Master summary, QC, and RUN_REPORT.txt"], "caution": "For short WGS, QC completed_negative includes localized_indeterminate. Read the underlying evidence category to distinguish weak evidence from zero reads.", "sources": ["scripts/build_cohort_report.py", "scripts/build_master_summary.py", "scripts/build_qc_summary.py"]}, {"id": "contigs", "group": "D. Results", "title": "Inspect contig alignments and read depth", "hit": [65, 1341, 1470, 191], "view": [65, 1341, 1470, 191], "scope": "Samples where targeted WGS assembly produced a contig-validation plot", "steps": ["Open the report's contigs link to reveal the linked SVG plot below the cohort table.", "Compare the IHE3034 reference gene track, MEGAHIT alignments, metaSPAdes alignments, and raw read depth across the pks region.", "Review assembler agreement together with recruitment diagnostics and island coverage, rather than interpreting contig count alone.", "Keep the cohort HTML with the by_sample output tree; the report loads plot files using relative links."], "parameters": ["by_sample/<sample>/figures/contig_validation.svg", "by_sample/<sample>/contigs/final_evidence/final_pks_evidence.tsv"], "outputs": ["Reference/contig alignment plot with raw read depth", "Linked, run-specific per-sample evidence"], "caution": "The drawing in this workflow is illustrative. It is not a real sample result or a live report.", "sources": ["Modules/pks_targeted.nf", "scripts/summarize_tumor_pks_contigs.py", "scripts/build_cohort_report.py"]}]</script>
  <script>(function () {
  const root = document.getElementById('pks-workflow-hover');
  if (!root) return;
  const get = key => root.querySelector('[data-wh="' + key + '"]');
  const data = JSON.parse(get('data').textContent), byId = new Map(data.map(d => [d.id,d]));
  const pop = get('popover'), map = get('map'), surface = get('surface'), lens = get('lens').querySelector('svg');
  const buttons = Array.from(root.querySelectorAll('[data-step]'));
  let current = null, hideTimer = null;
  function cancelHide() { if (hideTimer !== null) clearTimeout(hideTimer); hideTimer = null; }
  function fill(node, items, tag) {
    node.replaceChildren();
    items.forEach(text => { const e=document.createElement(tag); e.textContent=text; node.appendChild(e); });
  }
  function position() {
    if (pop.hidden || !current) return;
    const d=byId.get(current), box=map.getBoundingClientRect(), w=box.width, h=box.height;
    const width=Math.min(410,w);
    pop.style.width=width+'px';
    const ph=pop.offsetHeight, center=(d.hit[0]+d.hit[2]/2)/1600*w;
    const anchorTop=d.hit[1]/1580*h, anchorBottom=(d.hit[1]+d.hit[3])/1580*h;
    let left=center<w/2 ? (d.hit[0]+d.hit[2])/1600*w+12 : d.hit[0]/1600*w-width-12;
    left=Math.max(0,Math.min(w-width,left));
    let top=Math.max(0,Math.min(anchorTop-12,h-ph));
    if (w<540) top=anchorBottom+8;
    pop.style.left=left+'px'; pop.style.top=top+'px';
    surface.style.paddingBottom=Math.max(0,top+ph-h)+'px';
  }
  function close(restoreFocus) {
    cancelHide(); pop.hidden=true; surface.style.paddingBottom='0px';
    const old=buttons.find(b=>b.dataset.step===current);
    current=null;
    buttons.forEach(b=>{ b.dataset.active='false'; b.setAttribute('aria-expanded','false'); });
    if (restoreFocus && old) old.focus();
  }
  function open(id, announce) {
    cancelHide();
    const d=byId.get(id); if (!d) return;
    current=id;
    get('title').textContent=d.title;get('scope').textContent=d.scope;
    fill(get('steps'),d.steps,'li');fill(get('parameters'),d.parameters,'code');fill(get('outputs'),d.outputs,'code');
    get('caution').textContent=d.caution;
    lens.setAttribute('viewBox',d.view.join(' '));lens.setAttribute('aria-label','Enlarged view: '+d.title);
    get('sources').replaceChildren();
    d.sources.forEach((file,i)=>{
      const a=document.createElement('a');a.href='https://github.com/AlexandrovLab/pksProfiler/blob/c7ba5cfe3809a553629437073c4bfc261e6b638e/'+file;
      a.textContent=i===0?'Source code':file.split('/').pop();a.target='_blank';a.rel='noopener noreferrer';get('sources').appendChild(a);
    });
    pop.hidden=false;
    buttons.forEach(b=>{ const active=b.dataset.step===id; b.dataset.active=String(active); b.setAttribute('aria-expanded',String(active)); });
    position();
    if(announce) get('status').textContent=d.title+'. Details opened.';
  }
  function scheduleHide() { cancelHide(); hideTimer=setTimeout(()=>close(false),260); }
  buttons.forEach(button=>{
    button.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')open(button.dataset.step,false);});
    button.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')scheduleHide();});
    button.addEventListener('focus',()=>open(button.dataset.step,true));
    button.addEventListener('click',()=>open(button.dataset.step,true));
  });
  pop.addEventListener('pointerenter',cancelHide);
  pop.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')scheduleHide();});
  pop.addEventListener('focusin',cancelHide);
  root.addEventListener('focusout',e=>{if(!root.contains(e.relatedTarget))close(false);});
  get('close').addEventListener('click',()=>close(false));
  root.addEventListener('keydown',e=>{if(e.key==='Escape')close(false);});
  document.addEventListener('pointerdown',e=>{if(!root.contains(e.target))close(false);});
  window.addEventListener('resize',position);
  // Hover is transient: never persist or restore an open popup.
})();
</script>
