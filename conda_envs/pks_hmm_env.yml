name: pksprofiler-hmm

# T6 (Ludmil, 28 Sep): pandas was pinned only to the 2.3 series, so a rebuild could pick
# up any 2.3.x. Pinned to the 2.3.3 that was resolving.

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10.22
  - pandas=2.3.3
  - hmmer=3.4
  - seqtk=1.5
  - seqkit=2.14.0
