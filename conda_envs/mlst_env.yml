name: mlst_env

# T6 (Ludmil, 28 Sep). mlst calls sequence types by blasting against its scheme database;
# blast and any2fasta were undeclared. Pinned to what was resolving (14 Oct 2026). The
# PubMLST scheme snapshot shipped inside the mlst package is fixed by mlst=2.35.0 and is
# recorded in conf/databases.tsv (T7).

channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.9
  - mlst=2.35.0
  - blast=2.16.0
  - any2fasta=0.8.1
