name: pksprofiler-align

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.12
  - pandas=2.3
  - bowtie2=2.5.5
  # long-read profiling (--read_type ont|hifi), same version as host depletion
  - minimap2=2.31
  - samtools=1.24
  - bedtools=2.31.1
  - subread=2.1.1
  - deeptools=4.0.0
  - r-base
  - r-circlize
  - r-cairo
  - r-dplyr