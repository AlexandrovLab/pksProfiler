name: CI

on:
  push:
    # rc2: integration/** and fix/** branches and v* tags were not covered, so the
    # tagged v1.0.0-rc1 commit (integration/v1.0.0-rc1) never ran CI.
    branches: [main, "release/**", "feature/**", "integration/**", "fix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # F21: the real-execution jobs below must run on a schedule, not only when someone
  # remembers to dispatch them. 07:00 UTC daily, so a break introduced during the day is
  # reported by the next morning rather than at the next release.
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-free: asserts the pipeline's contracts from the source files.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas and matplotlib
        # build_hmm_matrix.py, mergeGeneCounts.py and plot_bracken_taxa.py import
        # pandas (see conda_envs/pks_align_env.yml, pks_hmm_env.yml,
        # krakenUniq_bracken_env.yml, all pinned to 2.3.x); plot_bracken_taxa.py also
        # imports matplotlib. This job otherwise runs dependency-free by design;
        # these two are the exception the tests exercising those three scripts need.
        run: pip install "pandas==2.3.0" "matplotlib==3.10.3"
      - name: Run test suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py' -v

  # Compiles main.nf and checks that parameter validation rejects bad input. No databases
  # and no sequencing data are needed: every case fails during validation, before any
  # process executes.
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pandas and matplotlib
        # tests/run_checks.sh's own first step runs the full unittest suite (the
        # same one the unit-tests job runs) before its Nextflow validation checks --
        # see that job's "Install pandas and matplotlib" step for why these two are
        # needed.
        run: pip install "pandas==2.3.0" "matplotlib==3.10.3"
      - name: Compile the workflow
        run: nextflow run main.nf --help
      - name: Build the workflow graph for each flag combination
        # `--help` compiles the script; it does not wire the channels. A defect like the
        # Bracken multi-channel one (21 September) compiles cleanly and dies when the
        # graph is built, so -preview is the cheapest place to catch it. Stand-in
        # reference files satisfy the existence checks; -preview opens none of them, and
        # the combinations needing a real database are skipped and named.
        run: |
          mkdir -p ci-refs
          # The names the script looks for under DB_ROOT.
          printf 'x' > ci-refs/human-GRC-db.mmi
          printf 'x' > ci-refs/human-GCA-phix-db.mmi
          DB_ROOT="$PWD/ci-refs" bash tests/check_workflow_construction.sh
      - name: Validation regression checks
        # run_checks.sh's own last step calls check_workflow_construction.sh again,
        # without a DB_ROOT override -- it defaults to the real TSCC path (correct for
        # someone running this by hand on TSCC), which does not exist on this runner.
        # Reuse the ci-refs stand-ins the step above already created for the same script.
        run: DB_ROOT="$PWD/ci-refs" bash tests/run_checks.sh

  # Ludmil's audit, u-3 and F21: a real (non -preview) execution, so bowtie2/minimap2/
  # fastp/samtools/nhmmscan interacting through the real Nextflow channel wiring is
  # checked for real, not just the graph. Seven real pipeline runs now (paired FASTQ,
  # BAM, CRAM, single-end FASTQ, --profiling_method hmm, a 5-sample cohort, and the
  # malformed-input cohort -- see each check script's own header), plus the
  # resume-after-reference-change check below.
  #
  # F21 asks for these to actually run in CI rather than waiting for someone to dispatch
  # them, so this job now runs:
  #   * on every push to main            -- the branch releases are cut from
  #   * nightly on the schedule above    -- so a break on a feature branch that merged
  #                                         late is caught within a day
  #   * on manual dispatch               -- unchanged, for working on this area
  # Still NOT on every pull request: a GitHub-hosted runner has no persistent conda cache
  # (unlike CONDA_CACHE_DIR on TSCC), so the fixtures are deliberately tiny and the conda
  # environments are cached between runs by actions/cache, keyed on conda_envs/*.yml --
  # Nextflow hashes its environments from file CONTENT, so a restored cache is reused
  # exactly as the local one is. The first run after a conda_envs change pays the full
  # solve; subsequent runs do not.
  #
  # rc2 review 2.2: "the release CI should execute the end-to-end and mode-specific checks
  # on the exact v1.0.0 tag, not only unit tests / graph construction." Until now a `v*`
  # tag ran only unit-tests and workflow-validation, so a tag build proved the workflow
  # compiled and its parameter validation worked -- not that it ran. A tag now runs this
  # job, on the tagged commit, like main does.
  e2e-execution:
    name: End-to-end execution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "24.10.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: latest
          auto-update-conda: false
          auto-activate-base: true
      - name: Cache the pipeline's conda environments
        # Keyed on the environment files' content, which is exactly what Nextflow hashes
        # an environment from, so a cache hit is a genuine reuse and not an approximation.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/conda_cache
          key: pks-conda-${{ runner.os }}-${{ hashFiles('conda_envs/*.yml') }}
      - name: Install minimap2 and samtools for fixture building
        # Nextflow builds its own copies of these (and every other tool) inside the
        # pipeline's own conda envs; these are only for the tests/fixtures/
        # generate_e2e_fixtures.py index-build step, before the pipeline runs.
        #
        # samtools is needed too, not just minimap2: the fixture builders sort and index
        # the BAM fixtures with it. check_e2e_execution.sh and check_malformed_input_
        # execution.sh both look for it, and it is not present on a stock runner.
        #
        # The path is exported rather than left to PATH. The v1.0.0 tag build failed here
        # with "no minimap2 found" even though this install step had succeeded, because
        # the next step runs in its own login shell and the base environment's bin
        # directory did not reach its PATH. Resolving the binaries now, failing loudly
        # here if the install produced none, and handing absolute paths to the checks
        # removes that dependency: tests/check_*.sh honour MINIMAP2_BIN first.
        shell: bash -l {0}
        run: |
          conda install -y -n base -c bioconda -c conda-forge minimap2 samtools
          mm=$(command -v minimap2 || true); [[ -x "$mm" ]] || mm="$CONDA/bin/minimap2"
          st=$(command -v samtools || true); [[ -x "$st" ]] || st="$CONDA/bin/samtools"
          for b in "$mm" "$st"; do
              [[ -x "$b" ]] || { echo "::error::$b is missing after conda install"; exit 1; }
          done
          echo "MINIMAP2_BIN=$mm" >> "$GITHUB_ENV"
          echo "PATH=$(dirname "$mm"):$PATH" >> "$GITHUB_ENV"
          "$mm" --version
          "$st" --version | head -1
      - name: Run the real end-to-end execution check
        shell: bash -l {0}
        env:
          # No shared cache on a GitHub-hosted runner; every conda env this run
          # needs is solved and built fresh, into the runner's own temp space.
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: bash tests/check_e2e_execution.sh
      - name: Run the real malformed-input execution check
        # F21: a truncated BAM and a BAM with corrupted leading magic bytes, run
        # alongside a healthy sample in one cohort -- same conda envs as the step
        # above, so no additional setup.
        shell: bash -l {0}
        env:
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: bash tests/check_malformed_input_execution.sh
      - name: Run the real per-mode execution checks
        # F21 names "one real execution test per modality"; tests/check_mode_execution.sh
        # is that script and nothing ran it in CI before.
        shell: bash -l {0}
        env:
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: bash tests/check_mode_execution.sh
      - name: Run the V8a/V8b lane execution checks
        # Ludmil V8a/V8b: one real run of each lane on synthetic reads whose correct
        # answer the fixture knows -- island reads vs a 12%-divergent NRPS/PKS look-alike
        # for V8a, and a 3%-divergent Klebsiella carrier copy for V8b.
        shell: bash -l {0}
        env:
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: bash tests/check_v8_lanes_execution.sh
      - name: Run the resume-after-reference-change check
        # F21, "resume/reference-change tests", and the only execution proof of the F15
        # dependency-digest mechanism: change a reference's content, resume, and assert
        # that exactly the tasks depending on it re-ran.
        shell: bash -l {0}
        env:
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: bash tests/check_resume_reference_change.sh
      - name: Install pandas and matplotlib for the unit suite
        # The skip assertion below runs the whole unit suite in THIS job, under the
        # conda base `bash -l` shell rather than the setup-python interpreter the
        # unit-tests job uses, so it needs the same two packages that job installs (see
        # its own step for why). Without them those tests error rather than skip, and
        # the assertion would fail for the wrong reason.
        shell: bash -l {0}
        run: pip install "pandas==2.3.0" "matplotlib==3.10.3"
      - name: Assert the critical tests actually ran
        # rc2 review 2.3: "Fail the release if critical tests are skipped. The fast test
        # environment can skip rescue, fragment-support and competitive-realignment tests
        # when external tools are absent." Our own rc2 run reported `OK (skipped=13)` and
        # nothing looked at the 13 -- they were exactly those tests.
        #
        # Run HERE, at the end of this job, deliberately: the steps above have built the
        # pipeline's conda environments into CONDA_CACHE_DIR, and those tests resolve
        # samtools / minimap2 / bedtools / featureCounts from it. In the unit-tests job
        # they have nothing to find and skip silently.
        #
        # assert_required_coverage.py fails on a failure, an error, a skipped REQUIRED
        # test, any skip not in its written-down ALLOWED_SKIPS, or a total over budget.
        # The budget is its default (the size of that list: one, R for the coverage-plot
        # figure, which no number depends on).
        shell: bash -l {0}
        env:
          CONDA_CACHE_DIR: ${{ runner.temp }}/conda_cache
        run: |
          python tests/assert_required_coverage.py -q \
            --json "${{ runner.temp }}/required-coverage.json"
      - name: Keep the required-coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/required-coverage.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Keep the execution-test outputs
        # Ludmil's F21 acceptance note: "Resource and cohort-scale tests can run
        # separately on scheduled CI or HPC, but their outputs should be retained."
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-test-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pks-*/**/*.log
            ${{ runner.temp }}/pks-*/**/trace*.txt
            ${{ runner.temp }}/pks-*/results*/runs/**
          if-no-files-found: ignore
          retention-days: 14

  # tests/check_metagenome_mag_execution.sh: a real (non -preview) execution of the
  # metagenome --enable_mags lane, sized so MetaBAT2 recovers zero real bins and the
  # whole assembly is pooled as "unbinned" (real tool behaviour, confirmed by running
  # it, not something a stand-in database can simulate) -- the exact scenario that
  # exposed genomes/pks_mag_summary.tsv silently never being written for a zero-bin
  # sample (Modules/pks_mag.nf's stubBinlessMagQuality fixes it). Deliberately NOT
  # wired into a job here, even a workflow_dispatch one like e2e-execution above: it
  # needs the real GTDB-Tk (~100+ GB), CheckM2 (~3 GB) and geNomad reference databases
  # -- there is no small stand-in, tests/check_workflow_construction.sh's own
  # need()-and-skip pattern would defeat the point of an execution test whose entire
  # subject is these databases actually being read by real tools, and fetching them
  # fresh on a GitHub-hosted runner on every dispatch is not a reasonable cost. Run it
  # by hand on TSCC instead, where they already live:
  #
  #     DB_ROOT=/tscc/projects/ps-lalexandrov/shared/CMPipeline_nextflow/dbs \
  #         bash tests/check_metagenome_mag_execution.sh
  #
  # Revisit if this ever runs on a self-hosted runner with those databases already local.
  # Until then it is covered by the recorded-result gate below, which is rc2 review 2.2's
  # own fallback ("make the tag job require a recorded local execution-check result").

  # The release gate. Runs on a `v*` tag and nothing else, and is the job that decides
  # whether a tag is releasable. It adds nothing new to run: it depends on the three jobs
  # that do the running, and then checks the one thing a GitHub runner cannot do itself.
  #
  # rc2 review 2.2 and 2.3, together:
  #
  #   2.2  The real execution checks must run on the exact tag. They do -- e2e-execution
  #        is now triggered by a tag, and `needs:` makes this job wait for it, so a tag
  #        whose end-to-end, malformed-input, mode, V8-lane or resume check fails cannot
  #        reach this job at all. One check still cannot run on a runner
  #        (check_metagenome_mag_execution.sh: GTDB-Tk r232 is ~100 GB), and for that one
  #        the review's own fallback applies: a committed, signed-off local result, whose
  #        source digest and test counts this job verifies.
  #
  #   2.3  "Tests pass" must not be able to hide missing coverage. The skip assertion runs
  #        inside e2e-execution, where the tools exist; this job restates it as a
  #        requirement of the release rather than a step someone could drop.
  release-gate:
    name: Release gate (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, workflow-validation, e2e-execution]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag's own commit, with history, so the record's commit line can be read
          # as the human context it is.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the recorded local execution checks
        # Refuses unless the record exists, covers every required check with status
        # `pass` and a non-zero assertion count, is signed off by a person, and -- the
        # assertion that matters -- its source digest equals this tree's. A record from
        # an earlier state of the code is refused, which is what stops "we ran it last
        # week" standing in for "we ran it on this tag".
        run: python tests/verify_local_execution_record.py
      - name: Say what was verified
        run: |
          echo "### Release gate passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- real execution checks ran on \`${GITHUB_SHA}\` (job: End-to-end execution)" >> "$GITHUB_STEP_SUMMARY"
          echo "- required-test / skip-budget assertion passed in that job" >> "$GITHUB_STEP_SUMMARY"
          echo "- local execution-check record verified against this tree" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' tests/LOCAL_EXECUTION_CHECKS.tsv >> "$GITHUB_STEP_SUMMARY"
